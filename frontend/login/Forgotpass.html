<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password</title>
  <style>
    :root{--accent:#5b5af8;--accent-2:#6b55f8;--card:#ffffff;--bg1:#eef6ff;--bg2:#f6f9ff}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:flex-start;justify-content:center;padding-top:56px}
    .container{width:420px;max-width:94%;padding:0 28px}
    .card{background:var(--card);border-radius:14px;padding:44px 28px 24px;box-shadow:0 10px 30px rgba(38,57,95,0.06);border:1px solid rgba(91,90,248,0.06);position:relative}
    .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;position:absolute;left:50%;top:0;transform:translate(-50%,-50%);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(38,57,95,0.12);border:4px solid rgba(255,255,255,0.85)}
    .avatar svg{width:34px;height:34px;display:block}
    h1{font-size:20px;margin:12px 0 4px;text-align:center;color:#13283b;font-weight:800}
    p.lead{font-size:13px;margin:0 0 6px;text-align:center;color:#5e6f80}
    .small-desc{font-size:12px;color:#8a9cb0;text-align:center;margin-bottom:16px}
    form{display:block}
    .field{display:flex;flex-direction:column;margin-bottom:8px}
    label{font-size:12px;color:#5e6f80;margin-bottom:8px;font-weight:600}
    input[type=email]{height:44px;padding:10px 12px;border-radius:8px;border:1px solid #e6eef9;background:#fff;font-size:14px;color:#213142;box-sizing:border-box;width:100%;display:block}
    .helper{font-size:12px;color:#9aa9b8;margin-top:6px}
    .submit{margin-top:12px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:12px 16px;border-radius:8px;width:100%;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(91,90,248,0.12)}
    .divider-row{margin:16px 0;display:flex;align-items:center;gap:12px}
    .divider-row hr{flex:1;border:none;height:1px;background:#e6eef9}
    .divider-row .label{font-size:13px;color:#9aa9b8;white-space:nowrap}
    .back-btn{width:100%;border:1px solid #e6eef9;background:#fff;padding:10px 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#213142}
    .small-link{font-size:13px;text-align:center;margin-top:10px;color:#6f8092}
    .small-link a{color:var(--accent);font-weight:600;text-decoration:none}
    .legal{max-width:420px;margin:18px auto 0;text-align:center;font-size:12px;color:#6f8ca6;padding:6px 8px}
    .legal a{color:var(--accent);text-decoration:none;font-weight:600}
    @media (max-width:420px){.container{padding:0 16px}.card{padding-top:56px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="avatar" aria-hidden="true">
        <!-- lock inside circle -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect x="3" y="10" width="18" height="10" rx="2" fill="rgba(255,255,255,0.95)"/>
          <path d="M7 10V8a5 5 0 1110 0v2" stroke="rgba(255,255,255,0.95)" stroke-width="1"/>
        </svg>
      </div>

      <h1>Forgot Password?</h1>
      <p class="lead">No worries! Enter your email and we'll send you reset instructions</p>

      <form action="#" method="post" onsubmit="return false;">
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="Enter your email address" />
          <div class="helper">We'll send password reset instructions to this email address</div>
        </div>

        <button class="submit" type="submit">✉️ Send Reset Link</button>

        <div class="divider-row">
          <hr />
          <div class="label">Or</div>
          <hr />
        </div>

        <div style="margin-bottom:8px"><a class="back-btn" href="login.html">← Back to Login</a></div>

        <div class="small-link">Remember your password? <a href="login.html">Login here</a></div>
      </form>
      <div class="legal" role="note">Having trouble? Contact our support team for assistance</div>
    </div>
  </div>

  
</body>
</html>
